<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>60 Qur'an Journey</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f6f2e9;--card:#fbf9f3;--tx:#2b2f2c;--mu:#6b716b;--ln:#ded8c8;--pr:#4f7a62;--prs:#dbe7dd;--ac:#a98a4d;--cur:#2f5d46;--nb:#ece7d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a17;--card:#1e2420;--tx:#e8e6dd;--mu:#9aa39b;--ln:#2e3630;--pr:#7fb094;--prs:#26382e;--ac:#cdb06f;--cur:#a9d8bd;--nb:#262d28}}
:root[data-theme="dark"]{--bg:#161a17;--card:#1e2420;--tx:#e8e6dd;--mu:#9aa39b;--ln:#2e3630;--pr:#7fb094;--prs:#26382e;--ac:#cdb06f;--cur:#a9d8bd;--nb:#262d28}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.serif{font-family:"Lora",Georgia,"Times New Roman",serif;font-weight:600;margin:0}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 14px}
nav.d{display:flex;gap:4px;flex-wrap:wrap}
nav a,.btn{border:1px solid var(--ln);background:var(--card);padding:8px 14px;border-radius:999px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
nav a[aria-current=page]{background:var(--pr);color:var(--bg);border-color:var(--pr)}
.btn.p{background:var(--pr);color:var(--bg);border-color:var(--pr);font-weight:600}
.btn.s{padding:4px 10px;min-height:32px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px}
.mu{color:var(--mu)}.sm{font-size:.9rem}
.hero{text-align:center;padding:26px 18px}
.hero .big{font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.1}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar{height:8px;background:var(--nb);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--pr);transition:width .4s}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.it{display:block;border:1px solid var(--ln);background:var(--card);border-radius:12px;padding:12px;cursor:pointer}
.it.done{background:var(--prs)}.it.cur{border-color:var(--cur);border-width:2px}
.pg{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.pc{border:1px solid var(--ln);background:var(--nb);border-radius:8px;min-height:44px;cursor:pointer}
.pc.r{background:var(--prs);color:var(--cur);font-weight:600}
.pc.c{outline:2px solid var(--cur);outline-offset:1px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%;margin:0;max-height:90vh;overflow:auto}
label{display:block;margin:10px 0 4px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips .btn[aria-pressed=true]{background:var(--pr);color:var(--bg)}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.2)}
nav.m{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:10}
nav.m a{border:0;background:none;flex-direction:column;font-size:.78rem;padding:4px 6px;border-radius:8px}
nav.m a[aria-current=page]{color:var(--cur);font-weight:700;background:var(--prs)}
@media(max-width:640px){nav.d{display:none}nav.m{display:flex}.wrap{padding-bottom:150px}}
.wk{display:flex;gap:8px;align-items:flex-end;height:70px}.wk div{flex:1;text-align:center;font-size:.75rem}.wk b{display:block;background:var(--pr);border-radius:4px 4px 0 0;min-height:3px}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;max-width:360px;margin-top:10px}.heat span{aspect-ratio:1;border-radius:3px;background:var(--nb)}.heat span.on{background:var(--pr)}.heat span.x{background:none}
.err{color:#b04a3a;font-size:.9rem;min-height:1.2em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#e8806f}}:root[data-theme="dark"] .err{color:#e8806f}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="ov"></div>
<script>
(function(){
var J=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582],TP=604,G=60;
var KEY="khatam60.v1",S={goal:G,started:false,k:{},sess:[],last:null,theme:"system"};
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function jr(j){return[J[j-1],(J[j]||TP+1)-1]}
function jlen(j){var r=jr(j);return r[1]-r[0]+1}
function jOf(p){for(var j=30;j>=1;j--)if(p>=J[j-1])return j}
function rd(k,p){return(S.k[k]||"")[p-1]==="1"}
function cnt(k){var s=S.k[k]||"",n=0;for(var i=0;i<s.length;i++)if(s[i]==="1")n++;return n}
function jc(k,j){var r=jr(j),n=0;for(var p=r[0];p<=r[1];p++)if(rd(k,p))n++;return n}
function setP(k,a,b,v){var s=(S.k[k]||new Array(TP+1).join("0")).split(""),ch=0,L=[];for(var p=a;p<=b;p++){var x=v?"1":"0";if(s[p-1]!==x){s[p-1]=x;ch++;L.push(p)}}S.k[k]=s.join("");setP.L=L;return ch}
function dk(d){d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(n){return n.toLocaleString("en-US")}
function pct(a,b){return b?Math.min(100,a/b*100):0}
function tot(){var kh=0,jz=0,pg=0;for(var k=1;k<=G;k++){var c=cnt(k);pg+=c;if(c===TP)kh++;if(c)for(var j=1;j<=30;j++)if(jc(k,j)===jlen(j))jz++}return{kh:kh,jz:jz,pg:pg}}
function cur(){var k=S.last?S.last.k:1;while(k<=G&&cnt(k)===TP)k++;if(k>G)return null;var from=(S.last&&S.last.k===k?S.last.p:0)+1,p=null,i;for(i=from;i<=TP;i++)if(!rd(k,i)){p=i;break}if(!p)for(i=1;i<=TP;i++)if(!rd(k,i)){p=i;break}return{k:k,p:p,j:jOf(p)}}
function streak(){var d=new Date(),set={};S.sess.forEach(function(s){if(!s.cu)set[s.d]=1});if(!set[dk(d)])d.setDate(d.getDate()-1);var n=0;while(set[dk(d)]){n++;d.setDate(d.getDate()-1)}return n}
function today(){var t=dk(),n=0,a=1e9,b=0,j=0;S.sess.forEach(function(s){if(s.d===t&&!s.cu){n+=s.n;a=Math.min(a,s.a);b=Math.max(b,s.b);var f=0,len=s.b-s.a+1;for(var p=s.a;p<=s.b;p++)f+=1/jlen(jOf(p));j+=f*s.n/len}});return{n:n,a:a,b:b,j:j}}
function bar(v){return'<div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(v)+'"><i style="width:'+v+'%"></i></div>'}
function chips(v,L,act){var c=window[v]||L[0][0];return'<div class="chips" role="group" aria-label="Filter">'+L.map(function(x){return'<button class="btn s" aria-pressed="'+(c===x[0])+'" data-a="'+act+'" data-f="'+x[0]+'">'+x[1]+'</button>'}).join("")+'</div>'}
function canUndo(){var s=S.sess[S.sess.length-1];return s&&((s.ps&&s.ps.length)||(s.ex&&s.ex.length))?s:null}
function undo(){var s=canUndo();if(!s)return;(s.ps||[]).forEach(function(p){setP(s.k,p,p,false)});(s.ex||[]).forEach(function(x){var a=(S.k[x[0]]||"").split("");if(a.length===TP){x[1].forEach(function(p){a[p-1]="0"});S.k[x[0]]=a.join("")}});S.sess.pop();var q=S.sess[S.sess.length-1];S.last=("pl" in s)?s.pl:(q?{k:q.k,p:q.b,t:q.t}:null);save()}
function heat(){var m={};S.sess.forEach(function(s){if(!s.cu)m[s.d]=(m[s.d]||0)+s.n});var e=new Date(),st=new Date(e);st.setDate(st.getDate()-(77+((e.getDay()+6)%7)));var h='<div class="card"><h3>Last 12 weeks</h3><div class="heat" role="img" aria-label="Reading activity, last 12 weeks">';for(var i=0;i<84;i++){var d=new Date(st);d.setDate(st.getDate()+i);if(dk(d)>dk(e)){h+='<span class="x"></span>';continue}var n=m[dk(d)]||0;h+='<span class="'+(n?"on":"")+'" title="'+dk(d)+': '+n+' pages" style="opacity:'+(n?Math.min(1,.4+n/40):1)+'"></span>'}return h+'</div></div>'}
function ring(v,txt,sub){var c=2*Math.PI*54;return'<svg width="170" height="170" viewBox="0 0 130 130" role="img" aria-label="'+txt+' '+sub+'"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--nb)" stroke-width="9"/><circle cx="65" cy="65" r="54" fill="none" stroke="var(--pr)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-v/100))+'" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset .5s"/><text x="65" y="68" text-anchor="middle" class="serif" font-size="26" fill="var(--tx)">'+txt+'</text><text x="65" y="86" text-anchor="middle" font-size="9" fill="var(--mu)">'+sub+'</text></svg>'}
function nav(r){var L=[["","Dashboard"],["khatams","Khatams"],["reading","Reading"],["history","History"],["settings","Settings"]];function m(c){return L.map(function(l){return'<a href="#/'+l[0]+'"'+(r[0]===l[0]||(l[0]==="khatams"&&r[0]==="k")?' aria-current="page"':"")+'>'+l[1]+'</a>'}).join("")}return{d:'<nav class="d" aria-label="Main">'+m()+'</nav>',m:'<nav class="m" aria-label="Main">'+m()+'</nav>'}}
function applyTheme(){var h=document.documentElement;if(S.theme==="system")h.removeAttribute("data-theme");else h.setAttribute("data-theme",S.theme)}
function route(){return(location.hash.replace(/^#\/?/,"")||"").split("/")}

function dash(){var t=tot(),c=cur(),td=today(),st=streak(),h="";
h+='<div class="card hero">'+ring(pct(t.pg,G*TP),Math.round(pct(t.pg,G*TP))+"%","complete")+'<div class="big serif">'+t.kh+' / '+G+'</div><div class="mu">Qur\'ans completed · '+pct(t.kh,G).toFixed(0)+'%</div><p class="sm mu" style="margin:10px 0 0">'+fmt(t.jz)+' / '+fmt(G*30)+' Juz &nbsp;·&nbsp; '+fmt(t.pg)+' / '+fmt(G*TP)+' pages</p></div>';
if(!t.pg&&!S.last)h+='<div class="card"><h2>Your 60-Qur\'an journey begins here.</h2><p class="mu">Start with your first page.</p><a class="btn p" href="#/k/1">Start Khatam 1</a></div>';
else if(!c)h+='<div class="card"><h2>Alhamdulillah — all '+G+' Khatams complete.</h2></div>';
else{var n=cnt(c.k);h+='<div class="card"><h3>Continue reading</h3><div class="row" style="margin-top:8px"><div><div class="serif" style="font-size:1.4rem">Khatam '+c.k+' · Juz '+c.j+' · Page '+c.p+'</div><div class="mu sm">'+n+' / '+TP+' pages in this Khatam</div></div><a class="btn p" href="#/k/'+c.k+'/j/'+c.j+'">Continue reading</a></div>'+bar(pct(n,TP))+'<div class="mu sm">'+(S.last&&S.last.t?"Last read: "+new Date(S.last.t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"")+'</div></div>'}
h+='<div class="card"><div class="row"><h3>Today</h3><span><button class="btn s" data-a="log">Update today\'s reading</button>'+(canUndo()?' <button class="btn s" data-a="undo">Undo last entry</button>':'')+'</span></div><div class="row" style="margin-top:8px"><div><b class="serif" style="font-size:1.5rem">'+td.n+'</b> <span class="mu">pages</span></div><div><b class="serif" style="font-size:1.5rem">'+td.j.toFixed(1)+'</b> <span class="mu">Juz</span></div><div><b class="serif" style="font-size:1.5rem">'+st+'</b> <span class="mu">day streak</span></div></div>'+(td.n?'<p class="mu sm" style="margin:8px 0 0">You read pages '+td.a+'–'+td.b+' today.</p>':'<p class="mu sm" style="margin:8px 0 0">Nothing logged yet today.</p>')+'</div>';
var days=[];for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dk(d),n2=0;S.sess.forEach(function(s){if(s.d===k&&!s.cu)n2+=s.n});days.push([d.toLocaleDateString("en-GB",{weekday:"short"}),n2])}
var mx=Math.max.apply(null,days.map(function(x){return x[1]}).concat([1]));
h+='<div class="card"><h3>This week</h3><div class="wk" style="margin-top:10px">'+days.map(function(x){return'<div title="'+x[1]+' pages"><b style="height:'+(x[1]/mx*50)+'px"></b>'+x[0]+'</div>'}).join("")+'</div></div>';
var rc=S.sess.slice(-3).reverse();h+='<div class="card"><h3>Recent activity</h3>'+(rc.length?rc.map(function(s){return sline(s)}).join(""):'<p class="mu">Your reading history will appear here once you begin.</p>')+'</div>';
var ms=[];if(t.jz>=1)ms.push("First Juz completed");if(t.kh>=1)ms.push("First Khatam completed");[10,20,30,40,50,60].forEach(function(x){if(t.kh>=x)ms.push(x+" Khatams completed")});
h+='<p class="mu sm" style="text-align:center">'+(ms.length?ms.join(" · "):"Your first Khatam is waiting.")+'</p>';return h}
function sline(s,nd){var d=new Date(s.t||s.d);return'<div class="row sm" style="padding:6px 0;border-top:1px solid var(--ln)"><span>'+(nd?"":d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" · ")+(s.cu?'Catch-up · ':'')+'Khatam '+s.k+' · Pages '+s.a+'–'+s.b+(s.ex&&s.ex.length?' + earlier Khatams':'')+'</span><span class="mu">'+s.n+' page'+(s.n===1?"":"s")+'</span></div>'}

function khs(){var t=tot(),ip=0;for(var k=1;k<=G;k++){var c=cnt(k);if(c>0&&c<TP)ip++}
var h='<h1>My '+G+' Khatams</h1><p class="mu">'+t.kh+' completed · '+ip+' in progress · '+(G-t.kh-ip)+' remaining</p>'+chips("_kf",[["all","All"],["prog","In progress"],["done","Completed"],["new","Not started"]],"kf")+'<div class="grid">';
for(var k=1;k<=G;k++){var c=cnt(k),jz=0,sk=c===TP?"done":c?"prog":"new";if(window._kf&&window._kf!=="all"&&window._kf!==sk)continue;if(c)for(var j=1;j<=30;j++)if(jc(k,j)===jlen(j))jz++;var st=c===TP?"✓ Completed":c?"In progress":"Not started";
h+='<a class="it'+(c===TP?" done":"")+'" href="#/k/'+k+'"><b class="serif">Khatam '+k+'</b><div class="mu sm">'+jz+' / 30 Juz</div><div class="mu sm">'+c+' / '+TP+' pages · '+pct(c,TP).toFixed(1)+'%</div>'+bar(pct(c,TP))+'<div class="sm">'+st+'</div></a>'}
return h+"</div>"}
function khd(k){if(k<1||k>G||isNaN(k))return"<p>Khatam not found.</p>";var c=cnt(k),jz=0;for(var j=1;j<=30;j++)if(jc(k,j)===jlen(j))jz++;var cu=cur();
var h='<p><a href="#/khatams" class="mu">← All Khatams</a></p><h1>Khatam '+k+'</h1><div class="card" style="margin-top:12px"><b class="serif">'+jz+' / 30 Juz</b> · '+c+' / '+TP+' pages · '+pct(c,TP).toFixed(1)+'%'+bar(pct(c,TP))+'</div><div class="grid">';
for(var j=1;j<=30;j++){var r=jr(j),n=jc(k,j),L=jlen(j),isCur=cu&&cu.k===k&&cu.j===j;
h+='<a class="it'+(n===L?" done":"")+(isCur?" cur":"")+'" href="#/k/'+k+'/j/'+j+'"><b class="serif">Juz '+j+'</b><div class="mu sm">Pages '+r[0]+'–'+r[1]+'</div>'+(n===L?'<div class="sm">✓ Complete</div>':n?'<div class="sm">'+n+' / '+L+' pages · '+Math.round(pct(n,L))+'%</div>'+bar(pct(n,L)):'<div class="mu sm">Not started</div>')+'</a>'}
return h+"</div>"}
function jd(k,j){if(k<1||k>G||j<1||j>30||isNaN(k)||isNaN(j))return"<p>Not found.</p>";var r=jr(j),n=jc(k,j),L=jlen(j),cu=cur();
var h='<p><a href="#/k/'+k+'" class="mu">← Khatam '+k+'</a></p><h1>Juz '+j+'</h1><div class="card" style="margin-top:12px"><b>Pages '+r[0]+'–'+r[1]+'</b> · '+n+' / '+L+' pages'+bar(pct(n,L))+'</div><div class="pg">';
for(var p=r[0];p<=r[1];p++){var rr=rd(k,p),isC=cu&&cu.k===k&&cu.p===p;h+='<button class="pc'+(rr?" r":"")+(isC?" c":"")+'" data-a="pg" data-k="'+k+'" data-p="'+p+'" aria-label="Page '+p+(rr?", read":", not read")+(isC?", current":"")+'">'+(rr?"✓ ":"")+p+'</button>'}
return h+'</div><div class="row" style="margin-top:14px"><button class="btn" data-a="rng" data-k="'+k+'" data-a1="'+r[0]+'" data-b1="'+r[1]+'">Mark whole Juz read</button></div>'}
function rdg(){var c=cur(),h='<h1>Reading</h1>';if(!c)return h+"<p>All Khatams complete.</p>";
h+='<div class="card"><div class="serif" style="font-size:1.4rem">Currently reading Khatam '+c.k+' · Juz '+c.j+' · Page '+c.p+'</div><p class="mu">Next: page '+c.p+'</p><div class="row" style="justify-content:flex-start"><a class="btn p" href="#/k/'+c.k+'/j/'+c.j+'">Continue reading</a><button class="btn" data-a="plus">+1 Page</button></div></div><div class="card"><h3>Log reading</h3>'+form(c)+'</div>';return h}
function form(c){c=c||cur()||{k:1,p:1};var o="";for(var k=1;k<=G;k++)o+='<option value="'+k+'"'+(k===c.k?" selected":"")+'>Khatam '+k+'</option>';
return'<label for="fk">Khatam</label><select id="fk">'+o+'</select><div class="row" style="gap:10px;flex-wrap:nowrap"><div style="flex:1"><label for="fa">Starting page</label><input id="fa" type="number" inputmode="numeric" min="1" max="'+TP+'" value="'+c.p+'"></div><div style="flex:1"><label for="fb">Ending page</label><input id="fb" type="number" inputmode="numeric" min="1" max="'+TP+'" value="'+c.p+'"></div></div><div class="err" id="fe" role="alert"></div><button class="btn p" data-a="submit">Mark as read</button>'}
function hist(){var f=window._hf||"all",now=Date.now(),lim={today:1,"7":7,"30":30}[f],h='<h1>History</h1><div class="chips" role="group" aria-label="Filter">';
[["today","Today"],["7","7 days"],["30","30 days"],["all","All time"]].forEach(function(x){h+='<button class="btn s" aria-pressed="'+(f===x[0])+'" data-a="hf" data-f="'+x[0]+'">'+x[1]+'</button>'});h+="</div>";
var l=S.sess.filter(function(s){if(!lim)return true;var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(lim-1));return(s.t||0)>=d.getTime()}).reverse();
var g=[],ix={};l.forEach(function(s){if(!(s.d in ix)){ix[s.d]=g.length;g.push({d:s.d,n:0,l:[]})}var o=g[ix[s.d]];o.n+=s.cu?0:s.n;o.l.push(s)});return h+heat()+'<div class="card">'+(g.length?g.map(function(o){return'<h3 style="font-size:1rem;margin-top:10px">'+new Date(o.l[0].t||o.d).toLocaleDateString("en-GB",{day:"numeric",month:"long"})+(o.n?' · '+o.n+' page'+(o.n===1?"":"s"):' · Catch-up')+'</h3>'+o.l.map(function(s){return sline(s,1)}).join("")}).join(""):'<p class="mu">Your reading history will appear here once you begin.</p>')+'</div>'}
